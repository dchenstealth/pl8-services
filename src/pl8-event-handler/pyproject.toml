[project]
name = "pl8-event-handler"
version = "0.1.0"
description = "PL8's event handler Lambda: applies async entity lifecycle updates"
requires-python = ">=3.14"
dependencies = [
    "pl8-base~=0.0.5",
    "boto3~=1.43.40",
    "aws-lambda-powertools~=3.35.0",
]

[dependency-groups]
dev = [
    "moto~=5.2.2",
    "ruff~=0.16.8",
    "pytest~=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
